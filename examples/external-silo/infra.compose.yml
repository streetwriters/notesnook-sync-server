name: notesnook-external-silo-infra

services:
  notesnook-silo:
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    hostname: notesnook-silo
    ports:
      - 9000:9000
    networks:
      - notesnook-shared
    volumes:
      - s3data:/data/s3
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BROWSER: "on"
    command: server /data/s3 --console-address :9090
    healthcheck:
      test: ["CMD", "silo", "healthcheck", "ready"]
      interval: 40s
      timeout: 30s
      retries: 3
      start_period: 60s

  notesnook-silo-setup:
    image: pgsty/mc:RELEASE.2026-09-13T00-00-00Z
    depends_on:
      notesnook-silo:
        condition: service_healthy
    networks:
      - notesnook-shared
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    command:
      - /bin/bash
      - -c
      - |
        mc alias set silo http://notesnook-silo:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin}
        mc mb silo/attachments -p

networks:
  notesnook-shared:
    name: notesnook-shared

volumes:
  s3data:
